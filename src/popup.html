<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="hdr">
    <div id="updateStatus" class="update-status">
      <span id="ghLink" class="gh-link" role="button" tabindex="0" title="打开 GitHub 仓库" aria-label="打开 GitHub 仓库">
        <svg class="gh-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
      </span>
      <span id="updateEmoji" class="update-emoji" aria-hidden="true"></span>
      <span id="updateText" class="update-text"></span>
    </div>
    <div class="hdr-actions">
      <button id="btnSpending" class="btn" hidden>积分</button>
      <button id="btnInfo" class="btn" hidden>下载设定</button>
      <button id="btnAssets" class="btn primary" hidden>下载资产包</button>
    </div>
  </header>

  <main id="assetsView">
    <nav id="tabs" class="tabs" hidden></nav>

    <div id="status" class="status">正在扫描页面…</div>
    <div id="list" class="list"></div>
  </main>

  <section id="spending" class="sp">
    <div class="sp-filters">
      <div id="spPresets" class="sp-chips">
        <button class="chip" data-preset="today">今天</button>
        <button class="chip" data-preset="7d">7天</button>
        <button class="chip" data-preset="30d">30天</button>
        <button class="chip" data-preset="month">本月</button>
        <button class="chip" data-preset="all">全部</button>
      </div>
      <div class="sp-dates">
        <input type="date" id="spFrom" aria-label="开始日期">
        <span>至</span>
        <input type="date" id="spTo" aria-label="结束日期">
      </div>
      <div class="sp-label">模型</div>
      <div id="spModels" class="sp-chips"></div>
      <div class="sp-label">分辨率</div>
      <div id="spRes" class="sp-chips"></div>
    </div>

    <div class="sp-kpis">
      <div class="kpi"><div class="kpi-label">消耗积分</div><div id="spCoins" class="kpi-val">–</div></div>
      <div class="kpi"><div class="kpi-label">生成次数</div><div id="spCount" class="kpi-val">–</div></div>
      <div class="kpi"><div class="kpi-label">视频总时长</div><div id="spSecs" class="kpi-val">–</div></div>
    </div>
    <div id="spNote" class="sp-note"></div>

    <div id="spChart" class="sp-chart"></div>
    <table id="spTable" class="sp-table"></table>

    <div class="sp-foot">
      <span id="spStatus" class="sp-status"></span>
      <button id="spReload" class="btn small">重新全部拉取</button>
      <button id="spCsv" class="btn small primary">导出 CSV</button>
    </div>
  </section>

  <script src="lib/core.js"></script>
  <script src="update-check.js"></script>
  <script src="page-config.js"></script>
  <script src="lib/stats.js"></script>
  <script src="spending.js"></script>
  <script src="popup.js"></script>
</body>
</html>
